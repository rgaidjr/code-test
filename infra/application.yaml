AWSTemplateFormatVersion: '2010-09-09'
Description: One environment of the PhilGEPS API. Release aliases and IAM Function URLs are managed by scripts/release.py.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: docs/AWS_DEVOPS.md
        has: Candidate validation, pipeline-owned aliases, and IAM-only HTTP access
        scope: shared
    must:
      - CloudFormation updates only the unpublished function; the release script controls live traffic.
      - Deploy images by digest and keep OpenAI secret values outside environment variables.
Parameters:
  FunctionName: {Type: String, AllowedPattern: '[a-z][a-z0-9-]{2,50}'}
  ImageUri: {Type: String, AllowedPattern: '.+@sha256:[a-f0-9]{64}'}
  ExecutionRoleArn: {Type: String}
  SecretArn: {Type: String}
  DatasetSha256: {Type: String, AllowedPattern: '[a-f0-9]{64}'}
  Revision: {Type: String, AllowedPattern: '[a-f0-9]{40}'}
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}'
      RetentionInDays: 14
  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Ref FunctionName
      PackageType: Image
      Architectures: [x86_64]
      Code: {ImageUri: !Ref ImageUri}
      Role: !Ref ExecutionRoleArn
      MemorySize: 2048
      Timeout: 180
      EphemeralStorage: {Size: 1024}
      Environment:
        Variables:
          APP_SECRET_ARN: !Ref SecretArn
          APP_REVISION: !Ref Revision
          DATASET_SHA256: !Ref DatasetSha256
          AUTH_MODE: aws_iam
          PHILGEPS_CACHE_DIR: /tmp/philgeps
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${FunctionName}-errors'
      AlarmDescription: Inspect CloudWatch logs. Configure SNS notification actions in the console or IaC.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref FunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${FunctionName}-throttles'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref FunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  HttpErrorsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - MetricNamespace: PhilGEPS/HTTP
          MetricName: ServerErrors
          MetricValue: '1'
          Unit: Count
          Dimensions:
            - Key: FunctionName
              Value: $.service
  HttpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${FunctionName}-http-errors'
      Namespace: PhilGEPS/HTTP
      MetricName: ServerErrors
      Dimensions: [{Name: FunctionName, Value: !Ref FunctionName}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  FunctionName: {Value: !Ref Function}
